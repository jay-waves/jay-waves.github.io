name: Update contribution chart

on:
  schedule:
    # Every day at 10:17 Beijing time (02:17 UTC).
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download and validate the contribution chart
        id: download
        env:
          CHART_URL: "https://ghchart.rshah.org/jay-waves"
        run: |
          set -euo pipefail
          temp_file="$RUNNER_TEMP/contributions.svg"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --max-time 60 \
            "$CHART_URL" \
            --output "$temp_file"

          test -s "$temp_file"
          grep --max-count=1 --quiet "<svg" "$temp_file"

          if cmp --silent "$temp_file" assets/contributions.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            install -m 0644 "$temp_file" assets/contributions.svg
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the updated chart
        if: steps.download.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: update contribution chart"
          git push

      - name: Request a Pages rebuild
        if: steps.download.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
