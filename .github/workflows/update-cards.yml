name: Update profile cards

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
  schedule:
    # Every day at 10:17 Beijing time (02:17 UTC).
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Download and validate the cards
        id: download
        env:
          LANGUAGE_CARD_URL: "https://github-stats-extended.vercel.app/api/top-langs?username=jay-waves&layout=compact&card_width=360&hide_title=true&langs_count=6&hide=CSS%2CTypst%2CHTML&hide_border=true&bg_color=00000000&title_color=111111&text_color=555555"
          CONTRIBUTION_CHART_URL: "https://ghchart.rshah.org/jay-waves"
        run: |
          set -euo pipefail
          language_card="$RUNNER_TEMP/top-langs.svg"
          contribution_chart="$RUNNER_TEMP/contributions.svg"

          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "$LANGUAGE_CARD_URL" --output "$language_card"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "$CONTRIBUTION_CHART_URL" --output "$contribution_chart"

          # Render statically, including text that the original animation reveals.
          sed -i 's#</style>#* { animation: none !important; } .stagger { opacity: 1 !important; }</style>#' "$language_card"

          python .github/scripts/style_profile_cards.py "$language_card" "$contribution_chart"

          test -s "$language_card"
          grep --max-count=1 --quiet "<svg" "$language_card"
          grep --quiet "Georgia, 'Times New Roman'" "$language_card"
          grep --quiet 'data-testid="lang-items" x="0"' "$language_card"
          test -s "$contribution_chart"
          grep --max-count=1 --quiet "<svg" "$contribution_chart"
          grep --quiet "Georgia, 'Times New Roman'" "$contribution_chart"

          changed=false
          if ! cmp --silent "$language_card" assets/top-langs.svg; then
            install -m 0644 "$language_card" assets/top-langs.svg
            changed=true
          fi
          if ! cmp --silent "$contribution_chart" assets/contributions.svg; then
            install -m 0644 "$contribution_chart" assets/contributions.svg
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit the updated cards
        if: steps.download.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg assets/contributions.svg
          git commit -m "chore: update profile cards"
          git push

      - name: Request a Pages rebuild
        if: steps.download.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
